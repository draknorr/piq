name: Review Histogram Sync

on:
  schedule:
    # Baseline cadence remains active before the capacity-v2 rollout variable is enabled.
    - cron: "23 4,16 * * *"
    # Six additional runs/day are gated by ENABLE_HISTOGRAM_CAPACITY_V2.
    - cron: "23 1,7,10,13,19,22 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of apps to process (worker cap: 1200)"
        required: false
        default: "1200"

concurrency:
  group: histogram-sync
  cancel-in-progress: false

env:
  DATA_READ_TARGET: tiger
  DATA_WRITE_TARGET: tiger
  TIGER_PRIMARY_URL: ${{ secrets.TIGER_PRODUCTION_URL }}

jobs:
  sync:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          vars.ENABLE_TIGER_METRICS_WRITERS == 'true' &&
          (
            github.event.schedule == '23 4,16 * * *' ||
            vars.ENABLE_HISTOGRAM_CAPACITY_V2 == 'true'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run Histogram sync
        run: pnpm --filter @publisheriq/ingestion histogram-sync
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          BATCH_SIZE: >-
            ${{
              github.event.inputs.batch_size ||
              (vars.ENABLE_HISTOGRAM_CAPACITY_V2 == 'true' && '1200' || '300')
            }}
          HISTOGRAM_MAX_RUNTIME_MINUTES: "22"
          HISTOGRAM_REQUEST_TIMEOUT_MS: "15000"
