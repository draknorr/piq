name: Alert Detection

on:
  schedule:
    # Run hourly at :15 (after CCU sync at :00)
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: alert-detection
  cancel-in-progress: false

env:
  ALERT_METRICS_READ_TARGET: tiger
  ALERT_STATE_WRITE_TARGET: tiger
  ALERT_DELIVERY_WRITE_TARGET: supabase
  ALERT_EVENT_LOOKBACK_MINUTES: '120'
  TIGER_PRIMARY_URL: ${{ secrets.TIGER_PRODUCTION_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  detect:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_TIGER_ALERT_WORKER == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run alert detection
        run: pnpm --filter @publisheriq/ingestion alert-detection
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
