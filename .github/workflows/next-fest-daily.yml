name: Next Fest Daily Snapshot

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Replay retained observations without Steam requests, or collect after replay is complete'
        type: choice
        options: ['replay', 'collect']
        default: 'replay'
      batch_size:
        description: '10 for the initial canary; 7218 for the full roster'
        type: choice
        options: ['10', '7218']
        default: '10'
      review_catch_up:
        description: 'One-time October 21 catch-up for the 2470 approved demo IDs'
        type: boolean
        default: false
      publish:
        description: 'Publish the completed full-roster snapshot to /next-fest'
        type: boolean
        default: false

concurrency:
  group: next-fest-daily
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  window:
    if: vars.ENABLE_NEXT_FEST_TIGER_WRITES == 'true' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_NEXT_FEST_COLLECTION == 'true')
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.window.outputs.active }}
      full: ${{ steps.window.outputs.full }}
    steps:
      - id: window
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '7218' }}
          REVIEW_CATCH_UP: ${{ inputs.review_catch_up }}
          MODE: ${{ inputs.mode }}
        run: |
          today=$(date -u +%F)
          if [[ "$REVIEW_CATCH_UP" == 'true' && ( "$GITHUB_EVENT_NAME" != 'workflow_dispatch' || "$today" != '2026-10-21' || "$MODE" != 'collect' || "$BATCH_SIZE" != '7218' ) ]]; then
            echo 'Catch-up requires an October 21 manual full collection.' >&2
            exit 1
          fi
          # October 21 is bootstrapped manually; do not queue a duplicate behind it.
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$today" < "2026-10-22" ]]; then exit 0; fi
          if [[ "$today" > '2026-10-19' && "$today" < '2026-11-03' ]]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$BATCH_SIZE" == '7218' ]]; then echo 'full=true' >> "$GITHUB_OUTPUT"; fi

  ccu:
    needs: window
    if: needs.window.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@publisheriq/database... --filter=@publisheriq/shared
      - id: state
        run: node scripts/ops/next-fest-github-state.mjs 1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Collect festival observations
        run: node scripts/ops/collect-next-fest.mjs --"$MODE" --signal=ccu --limit="$BATCH_SIZE"
        env:
          BATCH_SIZE: ${{ needs.window.outputs.full == 'true' && '7218' || '10' }}
          MODE: ${{ inputs.mode == 'replay' && 'replay-only' || 'collect' }}
          ENABLE_NEXT_FEST_TIGER_WRITES: ${{ vars.ENABLE_NEXT_FEST_TIGER_WRITES }}
          TIGER_PRIMARY_URL: ${{ secrets.TIGER_PRODUCTION_URL }}
          STEAM_REVIEWS_API_KEY: ${{ secrets.STEAM_REVIEWS_API_KEY }}
      - name: Preserve observations and attempt accounting, including failed runs
        if: always() && steps.state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: next-fest-state-1
          path: |
            output/steam-next-fest-2026-10/daily/
            apps/admin/src/app/next-fest/content/atlas.html
          retention-days: 21

  reviews:
    needs: [window, ccu]
    if: needs.window.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@publisheriq/database... --filter=@publisheriq/shared
      - id: state
        run: node scripts/ops/next-fest-github-state.mjs 2
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Collect festival observations
        run: |
          args=(--"$MODE" --signal=reviews --limit="$BATCH_SIZE")
          if [[ "$REVIEW_CATCH_UP" == 'true' ]]; then args+=(--review-catch-up); fi
          node scripts/ops/collect-next-fest.mjs "${args[@]}"
        env:
          BATCH_SIZE: ${{ needs.window.outputs.full == 'true' && '3609' || '10' }}
          REVIEW_CATCH_UP: ${{ inputs.review_catch_up }}
          MODE: ${{ inputs.mode == 'replay' && 'replay-only' || 'collect' }}
          ENABLE_NEXT_FEST_TIGER_WRITES: ${{ vars.ENABLE_NEXT_FEST_TIGER_WRITES }}
          TIGER_PRIMARY_URL: ${{ secrets.TIGER_PRODUCTION_URL }}
          STEAM_REVIEWS_API_KEY: ${{ secrets.STEAM_REVIEWS_API_KEY }}
      - if: always() && steps.state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: next-fest-state-2
          path: |
            output/steam-next-fest-2026-10/daily/
            apps/admin/src/app/next-fest/content/atlas.html
          retention-days: 21

  publish:
    needs: [window, reviews]
    if: inputs.mode != 'replay' && needs.window.outputs.full == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: next-fest-state-2
          path: /tmp/next-fest-publish
      - name: Publish only the atlas, preserving concurrent site edits
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVIEW_CATCH_UP: ${{ inputs.review_catch_up }}
        run: |
          set -euo pipefail
          atlas=apps/admin/src/app/next-fest/content/atlas.html
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync } from 'node:fs';
          import { decodeAtlas } from './scripts/ops/export-next-fest-popularity.mjs';
          import { parseJournal, verifyDailySnapshot } from './scripts/ops/collect-next-fest.mjs';
          const day = new Date().toISOString().slice(0, 10);
          const root = '/tmp/next-fest-publish';
          const html = readFileSync(root + '/apps/admin/src/app/next-fest/content/atlas.html', 'utf8');
          const directory = root + '/output/steam-next-fest-2026-10/daily';
          const records = readdirSync(directory).filter(n => n.endsWith('.journal.jsonl')).flatMap(n => parseJournal(readFileSync(directory + '/' + n, 'utf8')));
          if (decodeAtlas(html).popularity?.source !== 'tiger') throw new Error('Publication requires a Tiger export');
          console.log(verifyDailySnapshot(html, records, day, { reviewCatchUp: process.env.REVIEW_CATCH_UP === 'true' }));
          JS
          git fetch origin "$DEFAULT_BRANCH"
          if ! git diff --quiet "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" -- "$atlas"; then
            echo 'Atlas changed during collection; retain the artifact for review.' >&2
            exit 1
          fi
          git checkout -B next-fest-publish "origin/$DEFAULT_BRANCH"
          cp "/tmp/next-fest-publish/$atlas" "$atlas"
          git add -- "$atlas"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Next Fest demo reception snapshot'
          git push origin "HEAD:$DEFAULT_BRANCH"
