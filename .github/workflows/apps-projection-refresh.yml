name: Apps Projection Refresh

on:
  workflow_dispatch:
    inputs:
      backup_pitr_verified:
        description: "Tiger backup/PITR proof has been recorded"
        required: true
        type: boolean
        default: false
      approval_reference:
        description: "Link or identifier for the explicit production-write approval"
        required: true
        type: string

concurrency:
  group: apps-projection-refresh
  cancel-in-progress: false

env:
  TIGER_PRIMARY_URL: ${{ secrets.TIGER_PRODUCTION_URL }}

jobs:
  refresh:
    if: >-
      ${{
        inputs.backup_pitr_verified == true
        && inputs.approval_reference != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Record production-write gate
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          BACKUP_PITR_VERIFIED: ${{ inputs.backup_pitr_verified }}
        run: |
          {
            echo "Backup/PITR verified: $BACKUP_PITR_VERIFIED"
            echo "Approval reference: $APPROVAL_REFERENCE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Refresh apps projections
        run: |
          set -euo pipefail

          snapshot_sql="
            WITH source AS (
              SELECT count(*)::bigint AS row_count
              FROM legacy.apps
              WHERE COALESCE(is_released, false) = true
                AND COALESCE(is_delisted, false) = false
            ),
            projection AS (
              SELECT
                count(*)::bigint AS row_count,
                max(data_updated_at) AS latest_source_update_at
              FROM metrics.apps_page_projection
            )
            SELECT
              projection.row_count AS projection_rows,
              source.row_count AS source_rows,
              projection.row_count - source.row_count AS row_delta,
              projection.latest_source_update_at
            FROM projection
            CROSS JOIN source;
          "

          echo "Before refresh:" >> "$GITHUB_STEP_SUMMARY"
          psql "$TIGER_PRIMARY_URL" -X -v ON_ERROR_STOP=1 -c "$snapshot_sql" | tee -a "$GITHUB_STEP_SUMMARY"

          start_time=$(date +%s)

          psql "$TIGER_PRIMARY_URL" -X -v ON_ERROR_STOP=1 \
            -c "SET statement_timeout TO '30min'" \
            -c "SET lock_timeout TO '15s'" \
            -c "REFRESH MATERIALIZED VIEW CONCURRENTLY metrics.apps_page_projection;"

          psql "$TIGER_PRIMARY_URL" -X -v ON_ERROR_STOP=1 \
            -c "SET statement_timeout TO '10min'" \
            -c "SET lock_timeout TO '15s'" \
            -c "REFRESH MATERIALIZED VIEW CONCURRENTLY metrics.apps_page_filter_counts;"

          end_time=$(date +%s)
          duration=$((end_time - start_time))

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "After refresh:" >> "$GITHUB_STEP_SUMMARY"
          psql "$TIGER_PRIMARY_URL" -X -v ON_ERROR_STOP=1 -c "$snapshot_sql" | tee -a "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Duration: ${duration}s" >> "$GITHUB_STEP_SUMMARY"

          validation=$(psql "$TIGER_PRIMARY_URL" -X -v ON_ERROR_STOP=1 -tA -F '|' -c "
            WITH source AS (
              SELECT count(*)::bigint AS row_count
              FROM legacy.apps
              WHERE COALESCE(is_released, false) = true
                AND COALESCE(is_delisted, false) = false
            ),
            projection AS (
              SELECT
                count(*)::bigint AS row_count,
                max(data_updated_at) AS latest_source_update_at
              FROM metrics.apps_page_projection
            )
            SELECT
              projection.row_count - source.row_count,
              COALESCE(EXTRACT(EPOCH FROM (now() - projection.latest_source_update_at)) / 3600, 1000000000)
            FROM projection
            CROSS JOIN source;
          ")
          IFS='|' read -r row_delta freshness_hours <<< "$validation"

          if [[ "$row_delta" != "0" ]]; then
            echo "Projection/source row parity failed: delta=$row_delta" >&2
            exit 1
          fi

          if ! awk -v freshness="$freshness_hours" 'BEGIN { exit !(freshness <= 8) }'; then
            echo "Projection freshness SLO failed: ${freshness_hours}h" >&2
            exit 1
          fi
